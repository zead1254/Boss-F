<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BOSS FILES — Gateway to Another Dimension</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/fontsource/fonts/orbitron@latest/latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face {
    font-family: 'Orbitron';
    src: url('https://cdn.jsdelivr.net/fontsource/fonts/orbitron@latest/latin-700-normal.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Orbitron';
    src: url('https://cdn.jsdelivr.net/fontsource/fonts/orbitron@latest/latin-400-normal.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #e8eefc;
    font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  #cosmos {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    background: radial-gradient(ellipse at 50% 50%, #05071a 0%, #020208 60%, #000 100%);
  }

  /* Nebula layers */
  .nebula {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    mix-blend-mode: screen;
  }
  .nebula.visible { opacity: 1; }
  .nebula::before, .nebula::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
  }
  .nebula::before {
    width: 60vmax;
    height: 60vmax;
    left: -10vmax;
    top: -15vmax;
    background: radial-gradient(circle, rgba(80, 50, 180, 0.35) 0%, rgba(30, 20, 100, 0.15) 40%, transparent 70%);
    animation: drift1 40s ease-in-out infinite alternate;
  }
  .nebula::after {
    width: 55vmax;
    height: 55vmax;
    right: -15vmax;
    bottom: -20vmax;
    background: radial-gradient(circle, rgba(30, 90, 200, 0.3) 0%, rgba(10, 40, 120, 0.12) 45%, transparent 75%);
    animation: drift2 50s ease-in-out infinite alternate;
  }
  .nebula-2::before {
    background: radial-gradient(circle, rgba(140, 60, 200, 0.22) 0%, transparent 65%);
    width: 45vmax;
    height: 45vmax;
    left: 30vmax;
    top: 25vmax;
    animation: drift3 55s ease-in-out infinite alternate;
  }

  @keyframes drift1 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(5vw, 3vh) scale(1.1); }
  }
  @keyframes drift2 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-4vw, -5vh) scale(1.15); }
  }
  @keyframes drift3 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-6vw, 4vh) scale(0.95); }
  }

  /* Logo */
  #logoWrap {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 9vw, 7.5rem);
    letter-spacing: 0.18em;
    color: transparent;
    background: linear-gradient(180deg, #f5f7ff 0%, #b8c2d8 40%, #7a88a8 70%, #4a5570 100%);
    -webkit-background-clip: text;
    background-clip: text;
    position: relative;
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 1.2s ease-out, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    text-shadow:
      0 0 20px rgba(120, 170, 255, 0.35),
      0 0 40px rgba(80, 120, 220, 0.2);
    filter: drop-shadow(0 0 1px rgba(180, 210, 255, 0.6));
  }
  #logo.visible {
    opacity: 1;
    transform: scale(1);
  }
  #logo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg,
      transparent 0%,
      transparent 35%,
      rgba(255, 255, 255, 0.55) 50%,
      transparent 65%,
      transparent 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    background-size: 200% 100%;
    background-position: 200% 0;
    animation: sweep 2.2s ease-in-out forwards;
    animation-play-state: paused;
  }
  #logo.sweep::after { animation-play-state: running; }
  @keyframes sweep {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  #tagline {
    position: absolute;
    bottom: 28%;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(0.65rem, 1.3vw, 0.95rem);
    letter-spacing: 0.55em;
    color: rgba(170, 195, 235, 0.7);
    opacity: 0;
    transition: opacity 1.5s ease-out 0.5s;
    text-transform: uppercase;
    font-weight: 400;
    white-space: nowrap;
  }
  #tagline.visible { opacity: 1; }

  /* Portal */
  #portal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 0;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.6s ease-out;
    pointer-events: none;
  }
  #portal.active {
    opacity: 1;
  }
  .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    border: 1px solid rgba(120, 170, 255, 0.5);
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 30px rgba(100, 150, 255, 0.3),
      inset 0 0 30px rgba(100, 150, 255, 0.15);
  }
  .ring-1 {
    width: 100%;
    height: 100%;
    animation: spin 8s linear infinite;
    border-color: rgba(140, 180, 255, 0.4);
  }
  .ring-2 {
    width: 78%;
    height: 78%;
    animation: spin 6s linear infinite reverse;
    border-color: rgba(170, 140, 255, 0.5);
    border-style: dashed;
  }
  .ring-3 {
    width: 56%;
    height: 56%;
    animation: spin 4s linear infinite;
    border-color: rgba(120, 200, 255, 0.6);
  }
  .ring-4 {
    width: 34%;
    height: 34%;
    animation: spin 2.5s linear infinite reverse;
    border-color: rgba(200, 180, 255, 0.7);
    border-width: 2px;
  }
  @keyframes spin {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .portal-core {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 18%;
    height: 18%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(180, 210, 255, 0.8) 20%,
      rgba(100, 140, 255, 0.5) 45%,
      rgba(60, 80, 200, 0.2) 70%,
      transparent 100%);
    box-shadow:
      0 0 60px rgba(150, 190, 255, 0.8),
      0 0 120px rgba(100, 140, 255, 0.5),
      0 0 200px rgba(80, 100, 220, 0.3);
    animation: corePulse 2s ease-in-out infinite;
  }
  @keyframes corePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  /* Hyperspace overlay */
  #hyperspace {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 50% 50%,
      rgba(255, 255, 255, 0) 0%,
      rgba(200, 220, 255, 0) 30%,
      rgba(100, 140, 255, 0) 60%,
      rgba(0, 0, 0, 0) 100%);
    transition: opacity 0.3s ease-out;
  }
  #hyperspace.active { opacity: 1; }

  /* Flash */
  #flash {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease-out;
  }

  /* Fallback screen */
  #fallback {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: radial-gradient(ellipse at 50% 40%, #0a0f2a 0%, #030510 60%, #000 100%);
    text-align: center;
    opacity: 0;
    transition: opacity 0.8s ease-out;
  }
  #fallback.visible {
    display: flex;
    opacity: 1;
  }
  #fallback::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(80, 50, 180, 0.25) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(30, 90, 200, 0.2) 0%, transparent 50%);
    filter: blur(60px);
    pointer-events: none;
  }
  .fb-stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 50% 50%, rgba(200,220,255,0.7), transparent),
      radial-gradient(2px 2px at 80% 10%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(200,220,255,0.5), transparent),
      radial-gradient(1px 1px at 33% 80%, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 15% 65%, rgba(180,200,255,0.8), transparent),
      radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,0.5), transparent);
    background-size: 100% 100%;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }
  .fb-content {
    position: relative;
    z-index: 2;
    max-width: 720px;
  }
  .fb-logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 4rem);
    letter-spacing: 0.15em;
    background: linear-gradient(180deg, #f5f7ff 0%, #b8c2d8 50%, #6a7898 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 2.5rem;
    filter: drop-shadow(0 0 20px rgba(120, 170, 255, 0.4));
  }
  .fb-heading {
    font-size: clamp(0.9rem, 2.2vw, 1.4rem);
    letter-spacing: 0.35em;
    color: rgba(200, 220, 255, 0.9);
    margin-bottom: 1rem;
    font-weight: 400;
  }
  .fb-sub {
    font-size: clamp(0.75rem, 1.4vw, 0.95rem);
    letter-spacing: 0.15em;
    color: rgba(160, 180, 220, 0.65);
    margin-bottom: 3rem;
    font-weight: 400;
    line-height: 1.8;
  }
  .fb-btn {
    position: relative;
    display: inline-block;
    padding: 1.1rem 3rem;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
    letter-spacing: 0.3em;
    color: #e8f0ff;
    background: linear-gradient(135deg, rgba(60, 90, 180, 0.3) 0%, rgba(40, 60, 140, 0.2) 100%);
    border: 1px solid rgba(140, 180, 255, 0.5);
    border-radius: 2px;
    cursor: pointer;
    text-decoration: none;
    overflow: hidden;
    transition: all 0.35s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 0 20px rgba(100, 150, 255, 0.2),
      inset 0 0 20px rgba(100, 150, 255, 0.05);
  }
  .fb-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.6s ease;
  }
  .fb-btn:hover {
    border-color: rgba(180, 210, 255, 0.9);
    background: linear-gradient(135deg, rgba(80, 120, 220, 0.4) 0%, rgba(60, 90, 180, 0.3) 100%);
    box-shadow:
      0 0 40px rgba(120, 170, 255, 0.4),
      inset 0 0 30px rgba(120, 170, 255, 0.1);
    transform: translateY(-2px);
  }
  .fb-btn:hover::before { left: 100%; }

  .fb-footer {
    margin-top: 3.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: rgba(140, 160, 200, 0.4);
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .ring, .portal-core, .nebula::before, .nebula::after, .fb-stars {
      animation: none !important;
    }
    #logo, #tagline, .nebula, #fallback {
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 480px) {
    #logo { letter-spacing: 0.1em; }
    #tagline { letter-spacing: 0.3em; bottom: 22%; }
    .fb-btn { padding: 0.95rem 2rem; letter-spacing: 0.2em; }
  }
</style>
</head>
<body>

<canvas id="cosmos"></canvas>

<div class="nebula" id="nebula1"></div>
<div class="nebula nebula-2" id="nebula2"></div>

<div id="logoWrap">
  <div id="logo">BOSS FILES</div>
  <div id="tagline">THE GATEWAY TO ANOTHER DIMENSION</div>
</div>

<div id="portal">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="ring ring-4"></div>
  <div class="portal-core"></div>
</div>

<div id="hyperspace"></div>
<div id="flash"></div>

<div id="fallback">
  <div class="fb-stars"></div>
  <div class="fb-content">
    <div class="fb-logo">BOSS FILES</div>
    <div class="fb-heading">YOUR DESTINATION IS READY</div>
    <div class="fb-sub">The portal is open. Your next destination awaits.</div>
    <a href="#" id="enterBtn" class="fb-btn">ENTER BOSS FILES</a>
    <div class="fb-footer">SECURE DIMENSIONAL LINK • EST. 2026</div>
  </div>
</div>

<script>
  // ============================================================
  // BOSS FILES — Gateway to Another Dimension
  // ============================================================

  const DRIVE_URL = "https://drive.google.com/drive/folders/11fkM7syDL5R6-LmIH0N5JLM2YOgJiLiz?usp=sharing";

  // Performance / motion detection
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const devicePixelRatio = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);

  // Canvas setup
  const canvas = document.getElementById('cosmos');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, CX = 0, CY = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    CX = W / 2;
    CY = H / 2;
    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ============================================================
  // STARFIELD
  // ============================================================
  const STAR_COUNT = isMobile ? 220 : 420;
  const stars = [];

  function createStar() {
    const depth = Math.random(); // 0 = far, 1 = near
    return {
      x: (Math.random() - 0.5) * W * 2,
      y: (Math.random() - 0.5) * H * 2,
      z: depth * 800 + 50,
      baseSize: 0.3 + depth * 1.6,
      brightness: 0.3 + Math.random() * 0.7,
      twinkleSpeed: 0.5 + Math.random() * 2,
      twinkleOffset: Math.random() * Math.PI * 2,
      hue: Math.random() < 0.3 ? 220 : (Math.random() < 0.5 ? 200 : 240)
    };
  }

  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push(createStar());
  }

  // ============================================================
  // PORTAL PARTICLES
  // ============================================================
  const portalParticles = [];
  const PORTAL_PARTICLE_COUNT = isMobile ? 40 : 80;

  function createPortalParticle() {
    const angle = Math.random() * Math.PI * 2;
    const radius = 80 + Math.random() * 180;
    return {
      angle,
      radius,
      speed: 0.003 + Math.random() * 0.008,
      size: 0.5 + Math.random() * 2,
      opacity: 0.3 + Math.random() * 0.7,
      hue: 200 + Math.random() * 60,
      drift: (Math.random() - 0.5) * 0.3
    };
  }
  for (let i = 0; i < PORTAL_PARTICLE_COUNT; i++) {
    portalParticles.push(createPortalParticle());
  }

  // ============================================================
  // ANIMATION STATE
  // ============================================================
  const state = {
    phase: 'reveal',      // reveal -> logo -> portal -> hyperspace -> redirect
    startTime: performance.now(),
    globalAlpha: 0,
    portalSize: 0,
    portalIntensity: 0,
    hyperspaceSpeed: 0,
    hyperspaceProgress: 0,
    cameraZ: 0,
    redirectTriggered: false
  };

  // Timeline (ms)
  const T = {
    REVEAL_START: 0,
    LOGO_START: 900,
    PORTAL_START: 2200,
    HYPER_START: 4000,
    FLASH_START: 5200,
    REDIRECT: prefersReducedMotion ? 3500 : 5600
  };

  // ============================================================
  // RENDER LOOP
  // ============================================================
  let lastTime = performance.now();

  function render(now) {
    const dt = Math.min(now - lastTime, 50);
    lastTime = now;
    const elapsed = now - state.startTime;

    ctx.clearRect(0, 0, W, H);

    // Global fade-in for stars
    if (elapsed < 1500) {
      state.globalAlpha = Math.min(1, elapsed / 1500);
    } else {
      state.globalAlpha = 1;
    }

    // Hyperspace acceleration
    if (elapsed > T.HYPER_START) {
      const hyperElapsed = elapsed - T.HYPER_START;
      state.hyperspaceSpeed = Math.min(1, hyperElapsed / 1200);
      state.hyperspaceProgress = state.hyperspaceSpeed;
    }

    // Draw stars
    drawStars(elapsed, dt);

    // Draw portal particles
    if (elapsed > T.PORTAL_START && elapsed < T.HYPER_START + 800) {
      drawPortalParticles(elapsed);
    }

    // Phase transitions
    if (elapsed >= T.LOGO_START && state.phase === 'reveal') {
      state.phase = 'logo';
      document.getElementById('logo').classList.add('visible');
      document.getElementById('logo').classList.add('sweep');
      document.getElementById('tagline').classList.add('visible');
    }

    if (elapsed >= T.PORTAL_START && state.phase === 'logo') {
      state.phase = 'portal';
      const portal = document.getElementById('portal');
      portal.classList.add('active');
      animatePortalOpen();
    }

    if (elapsed >= T.HYPER_START && state.phase === 'portal') {
      state.phase = 'hyperspace';
      triggerHyperspace();
    }

    if (elapsed >= T.FLASH_START && !state.flashFired) {
      state.flashFired = true;
      triggerFlash();
    }

    if (elapsed >= T.REDIRECT && !state.redirectTriggered) {
      state.redirectTriggered = true;
      performRedirect();
    }

    requestAnimationFrame(render);
  }

  function drawStars(elapsed, dt) {
    const hyper = state.hyperspaceSpeed;
    const cx = CX;
    const cy = CY;

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];

      // Twinkle
      const twinkle = 0.6 + 0.4 * Math.sin(elapsed * 0.001 * s.twinkleSpeed + s.twinkleOffset);

      // Project star
      const perspective = 400 / (s.z + 400);
      let sx = cx + s.x * perspective;
      let sy = cy + s.y * perspective;

      // Hyperspace: stretch toward edges
      let size = s.baseSize * perspective * (1 + hyper * 3);
      let alpha = s.brightness * twinkle * state.globalAlpha;

      if (hyper > 0) {
        // Move star outward from center
        const dx = sx - cx;
        const dy = sy - cy;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const stretch = hyper * 180 * perspective;
        const nx = dx / dist;
        const ny = dy / dist;

        // Draw streak
        const streakLen = stretch * 2;
        const grad = ctx.createLinearGradient(
          sx - nx * streakLen, sy - ny * streakLen,
          sx, sy
        );
        grad.addColorStop(0, `hsla(${s.hue}, 80%, 85%, 0)`);
        grad.addColorStop(1, `hsla(${s.hue}, 80%, 90%, ${alpha})`);
        ctx.strokeStyle = grad;
        ctx.lineWidth = Math.max(0.5, size * 0.8);
        ctx.beginPath();
        ctx.moveTo(sx - nx * streakLen, sy - ny * streakLen);
        ctx.lineTo(sx, sy);
        ctx.stroke();

        // Move star outward
        s.x += nx * hyper * 8;
        s.y += ny * hyper * 8;

        // Reset if out of bounds
        if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) {
          s.x = (Math.random() - 0.5) * W * 0.5;
          s.y = (Math.random() - 0.5) * H * 0.5;
          s.z = 800;
        }
      } else {
        // Normal star
        ctx.fillStyle = `hsla(${s.hue}, 70%, 90%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(sx, sy, size, 0, Math.PI * 2);
        ctx.fill();

        // Glow for bright stars
        if (s.brightness > 0.8 && size > 1) {
          ctx.fillStyle = `hsla(${s.hue}, 80%, 85%, ${alpha * 0.2})`;
          ctx.beginPath();
          ctx.arc(sx, sy, size * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function drawPortalParticles(elapsed) {
    const portalProgress = Math.min(1, (elapsed - T.PORTAL_START) / 1500);
    const cx = CX;
    const cy = CY;

    for (let i = 0; i < portalParticles.length; i++) {
      const p = portalParticles[i];
      p.angle += p.speed;
      p.radius += p.drift;

      if (p.radius < 40 || p.radius > 280) {
        p.radius = 80 + Math.random() * 180;
      }

      const px = cx + Math.cos(p.angle) * p.radius * portalProgress;
      const py = cy + Math.sin(p.angle) * p.radius * portalProgress;

      const alpha = p.opacity * portalProgress * state.globalAlpha;
      ctx.fillStyle = `hsla(${p.hue}, 85%, 75%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(px, py, p.size * portalProgress, 0, Math.PI * 2);
      ctx.fill();

      // Glow
      ctx.fillStyle = `hsla(${p.hue}, 90%, 80%, ${alpha * 0.3})`;
      ctx.beginPath();
      ctx.arc(px, py, p.size * portalProgress * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function animatePortalOpen() {
    const portal = document.getElementById('portal');
    const startSize = 0;
    const targetSize = Math.min(W, H) * 0.9;
    const duration = 1800;
    const startTime = performance.now();

    function step() {
      const elapsed = performance.now() - startTime;
      const progress = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic

      const currentSize = startSize + (targetSize - startSize) * eased;
      portal.style.width = currentSize + 'px';
      portal.style.height = currentSize + 'px';

      if (progress < 1) requestAnimationFrame(step);
    }
    step();
  }

  function triggerHyperspace() {
    // Fade out portal
    const portal = document.getElementById('portal');
    portal.style.transition = 'opacity 0.6s ease-out, transform 1s ease-in';
    portal.style.opacity = '0';
    portal.style.transform = 'translate(-50%, -50%) scale(3)';

    // Fade out logo
    const logo = document.getElementById('logo');
    logo.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
    logo.style.opacity = '0';
    logo.style.transform = 'scale(1.5)';

    const tagline = document.getElementById('tagline');
    tagline.style.transition = 'opacity 0.5s ease-out';
    tagline.style.opacity = '0';

    // Hyperspace overlay
    const hyper = document.getElementById('hyperspace');
    hyper.classList.add('active');
    hyper.style.background = `radial-gradient(circle at 50% 50%,
      rgba(255, 255, 255, 0) 0%,
      rgba(200, 220, 255, 0.1) 30%,
      rgba(100, 140, 255, 0.2) 60%,
      rgba(0, 0, 0, 0) 100%)`;
  }

  function triggerFlash() {
    const flash = document.getElementById('flash');
    flash.style.transition = 'opacity 0.15s ease-out';
    flash.style.opacity = '1';
    setTimeout(() => {
      flash.style.transition = 'opacity 0.6s ease-out';
      flash.style.opacity = '0';
    }, 150);
  }

  function performRedirect() {
    try {
      window.location.replace(DRIVE_URL);
    } catch (e) {
      showFallback();
    }

    // Fallback if redirect didn't happen within 1.5s
    setTimeout(() => {
      if (!document.hidden) {
        showFallback();
      }
    }, 1500);
  }

  function showFallback() {
    const fallback = document.getElementById('fallback');
    fallback.style.display = 'flex';
    requestAnimationFrame(() => {
      fallback.classList.add('visible');
    });
  }

  // Enter button
  document.getElementById('enterBtn').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = DRIVE_URL;
  });

  // Handle visibility changes
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      lastTime = performance.now();
    }
  });

  // Start
  if (prefersReducedMotion) {
    // Simplified: show logo quickly, then redirect
    setTimeout(() => {
      document.getElementById('logo').classList.add('visible');
      document.getElementById('tagline').classList.add('visible');
      document.getElementById('nebula1').classList.add('visible');
    }, 100);
  } else {
    document.getElementById('nebula1').classList.add('visible');
    setTimeout(() => {
      document.getElementById('nebula2').classList.add('visible');
    }, 400);
  }

  requestAnimationFrame(render);
</script>

</body>
</html>
